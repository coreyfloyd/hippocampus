name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The architecture ancestor check needs history.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The installation checks run against the real CLIs. Without codex they fail
      # instead of skipping, and without claude the plugin checks skip.
      - run: npm install -g @openai/codex@0.162.0 @anthropic-ai/claude-code@2.1.300
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - run: bash tests/test-pickup-wrapper.sh
      - run: bash tests/test-pickup-branch-scan.sh
