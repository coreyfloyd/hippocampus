<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="meeting-title meeting-desc">
  <title id="meeting-title">Meeting capture and approved outcomes</title>
  <desc id="meeting-desc">Bring a calendar event, note or transcript into a meeting record through meeting-capture. Absorb executes approved people/document, follow-up, writing and optional wiki outcomes. The meeting record stays in its folder as a reference; the original transcript is filed after approved routes complete.</desc>
<style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191d;
        --panel: #22282e;
        --ink: #f0f2f5;
        --dim: #a2abb5;
        --line: #59636e;
        --question: #38bdf8;
        --question-bg: #102f3f;
        --answer: #fb923c;
        --answer-bg: #402719;
        --action: #34d399;
        --action-bg: #14382e;
        --off: #94a3b8;
        --off-bg: #29313a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15191d;
      --panel: #22282e;
      --ink: #f0f2f5;
      --dim: #a2abb5;
      --line: #59636e;
      --question: #38bdf8;
      --question-bg: #102f3f;
      --answer: #fb923c;
      --answer-bg: #402719;
      --action: #34d399;
      --action-bg: #14382e;
      --off: #94a3b8;
      --off-bg: #29313a;
    }
    :root[data-theme="light"] {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
    }
    .stage { fill: var(--panel); stroke-width: 2.5; }
    .input { fill: var(--question-bg); stroke: var(--question); stroke-width: 1.6; }
    .outcome { fill: var(--action-bg); stroke: var(--action); stroke-width: 1.4; }
    .label { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: var(--ink); font-family: var(--sans); font-size: 23px; font-weight: 750; }
    .stage-heading { fill: var(--ink); font-family: var(--sans); font-size: 19px; font-weight: 750; }
    .copy { fill: var(--dim); font-family: var(--sans); font-size: 15px; }
    .small { fill: var(--dim); font-family: var(--sans); font-size: 11.5px; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .branch { fill: none; stroke: var(--action); stroke-width: 1.8; marker-end: url(#action-arrow); }
    .skill { fill: var(--dim); font-family: var(--mono); font-size: 12px; }
  </style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--line)"/>
    </marker>
    <marker id="action-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--action)"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="var(--bg)"/>
  <text x="40" y="48" class="heading">Keep the meeting, carry the outcomes forward</text>
  <text data-diagram-key="true" x="40" y="75" class="copy">blue: what you bring · orange: what Hippocampus writes · green: where outcomes land</text>
  <rect data-thing="input" data-meeting-node="event" x="40" y="112" width="230" height="82" rx="12" class="input"/>
  <text data-meeting-input="event" x="58" y="144" class="stage-heading">Calendar event</text>
  <text data-meeting-input="event" x="58" y="171" class="copy">schedule and agenda</text>
  <rect data-thing="input" data-meeting-node="note" x="40" y="242" width="230" height="82" rx="12" class="input"/>
  <text data-meeting-input="note" x="58" y="274" class="stage-heading">Note</text>
  <text data-meeting-input="note" x="58" y="301" class="copy">file or collaborative document</text>
  <rect data-thing="input" data-meeting-node="transcript" x="40" y="372" width="230" height="82" rx="12" class="input"/>
  <text data-meeting-input="transcript" x="58" y="404" class="stage-heading">Transcript</text>
  <text data-meeting-input="transcript" x="58" y="431" class="copy">what was said, with sources</text>
  <rect data-thing="record" data-meeting-node="record" x="370" y="227" width="270" height="112" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="390" y="260" class="label" fill="var(--answer)">MEETING RECORD</text>
  <text x="390" y="291" class="stage-heading">In your meeting folder</text>
  <text x="390" y="316" class="small">sources · decisions · proposed outcomes</text>
  <rect data-thing="destinations" data-meeting-node="action" data-outcome-panel="true" x="820" y="108" width="340" height="392" rx="16" fill="var(--panel)" stroke="var(--action)" stroke-width="2.5"/>
  <text x="842" y="140" class="label" fill="var(--action)">ACTION</text>
  <text x="842" y="182" class="copy">Approved destinations.</text>
  <circle cx="842" cy="207" r="3" fill="var(--action)"/>
  <text data-outcome-label="documents" x="856" y="212" class="copy">People &amp; documents</text>
  <text x="856" y="228" class="small">named updates and people records</text>
  <circle cx="842" cy="253" r="3" fill="var(--action)"/>
  <text data-outcome-label="actions" x="856" y="258" class="copy">Follow-up work</text>
  <text x="856" y="274" class="small">ownership, timing and next steps</text>
  <circle cx="842" cy="299" r="3" fill="var(--action)"/>
  <text data-outcome-label="writing" x="856" y="304" class="copy">Writing opportunities</text>
  <text x="856" y="320" class="small">ideas or additions, with attribution</text>
  <circle cx="842" cy="345" r="3" fill="var(--action)"/>
  <text data-outcome-label="wiki" x="856" y="350" class="copy">Optional wiki</text>
  <text x="856" y="366" class="skill" data-skill="wiki-compile">wiki-compile</text>
  <circle cx="842" cy="391" r="3" fill="var(--action)"/>
  <text data-outcome-label="reference" x="856" y="396" class="copy">Retained reference record</text>
  <text x="856" y="412" class="small">record kept with sources and results</text>
  <circle cx="842" cy="437" r="3" fill="var(--action)"/>
  <text data-outcome-label="transcript" x="856" y="442" class="copy">Original transcript filed,<tspan x="856" dy="16" class="small"> after approved routes complete</tspan></text>
  <text x="842" y="486" class="small">Individual proposals may be declined.</text>

  <path d="M270,153 C290,153 290,210 300,210" fill="none" stroke="var(--line)" stroke-width="2.2"/>
  <path d="M270,283 C290,283 290,210 300,210" fill="none" stroke="var(--line)" stroke-width="2.2"/>
  <path d="M270,413 C310,413 310,230 300,210" fill="none" stroke="var(--line)" stroke-width="2.2"/>
  <g data-operation="inputs-record">
    <path d="M300,210 L350,210 L350,283 L370,283" class="edge"/>
    <text x="300" y="196" class="skill" data-skill="meeting-capture">meeting-capture</text>
  </g>
  <g data-operation="record-action">
    <path d="M640,283 L820,283" class="edge"/>
    <text x="710" y="270" class="skill" data-skill="absorb">absorb</text>
  </g>
</svg>
