<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The Hippocampus improvement loop</title>
  <desc id="loop-desc">A session in Claude Code or Codex writes a handoff through checkpoint or checklist, and lessons in it reach your rules through improve-harness. Sources and meetings become a research report or meeting record through research-topic or meeting-capture; absorb carries approved outcomes to the wiki through wiki-compile and to documents and follow-up work. The next session starts through pickup from better rules, a richer wiki and its handoff. Every change is proposed first and runs only once approved.</desc>
<style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191d;
        --panel: #22282e;
        --ink: #f0f2f5;
        --dim: #a2abb5;
        --line: #59636e;
        --question: #38bdf8;
        --question-bg: #102f3f;
        --answer: #fb923c;
        --answer-bg: #402719;
        --action: #34d399;
        --action-bg: #14382e;
        --off: #94a3b8;
        --off-bg: #29313a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15191d;
      --panel: #22282e;
      --ink: #f0f2f5;
      --dim: #a2abb5;
      --line: #59636e;
      --question: #38bdf8;
      --question-bg: #102f3f;
      --answer: #fb923c;
      --answer-bg: #402719;
      --action: #34d399;
      --action-bg: #14382e;
      --off: #94a3b8;
      --off-bg: #29313a;
    }
    :root[data-theme="light"] {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
    }
    .stage { fill: var(--panel); stroke-width: 2.5; }
    .input { fill: var(--question-bg); stroke: var(--question); stroke-width: 1.6; }
    .outcome { fill: var(--action-bg); stroke: var(--action); stroke-width: 1.4; }
    .label { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: var(--ink); font-family: var(--sans); font-size: 23px; font-weight: 750; }
    .stage-heading { fill: var(--ink); font-family: var(--sans); font-size: 19px; font-weight: 750; }
    .copy { fill: var(--dim); font-family: var(--sans); font-size: 15px; }
    .small { fill: var(--dim); font-family: var(--sans); font-size: 11.5px; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .branch { fill: none; stroke: var(--action); stroke-width: 1.8; marker-end: url(#action-arrow); }
    .skill { fill: var(--dim); font-family: var(--mono); font-size: 12px; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
  </style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--line)"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="var(--bg)"/>
  <text x="40" y="48" class="heading">Every session leaves the next one better</text>
  <text data-diagram-key="true" x="40" y="75" class="copy">blue: what you bring · orange: what Hippocampus writes · green: what gets better</text>
  <text data-column="work" x="40" y="104" class="column" fill="var(--question)">WORK</text>
  <text data-column="memory" x="370" y="104" class="column" fill="var(--answer)">MEMORY</text>
  <text data-column="improvement" x="820" y="104" class="column" fill="var(--action)">IMPROVEMENT</text>
  <rect data-thing="input" x="40" y="112" width="230" height="82" rx="12" class="input"/>
  <text x="58" y="144" class="stage-heading">A session</text>
  <text x="58" y="171" class="copy">in Claude Code or Codex</text>
  <rect data-thing="input" x="40" y="262" width="230" height="82" rx="12" class="input"/>
  <text x="58" y="294" class="stage-heading">Sources</text>
  <text x="58" y="321" class="copy">questions, links, meetings</text>
  <rect data-thing="record" x="370" y="112" width="270" height="112" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="390" y="145" class="label" fill="var(--answer)">HANDOFF</text>
  <text x="390" y="176" class="stage-heading">Where the work stands</text>
  <text x="390" y="201" class="small">open loops · lessons · pointers</text>
  <rect data-thing="record" x="370" y="300" width="270" height="112" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="390" y="333" class="label" fill="var(--answer)">REPORT OR RECORD</text>
  <text x="390" y="364" class="stage-heading">Research or a meeting</text>
  <text x="390" y="389" class="small">answer · sources · proposed outcomes</text>
  <rect data-thing="destination" data-outcome="rules" x="820" y="140" width="340" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="rules" x="836" y="164" class="outcome-title">Rules</text>
  <text x="836" y="182" class="small">instruction files, skills and hooks</text>
  <rect data-thing="destination" data-outcome="wiki" x="820" y="300" width="340" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="wiki" x="836" y="324" class="outcome-title">Wiki</text>
  <text x="836" y="342" class="skill" data-skill="wiki-compile">wiki-compile</text>
  <rect data-thing="destination" data-outcome="documents" x="820" y="366" width="340" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="documents" x="836" y="390" class="outcome-title">Documents and follow-up work</text>
  <text x="836" y="408" class="small">named updates and next steps</text>
  <g data-operation="session-handoff">
    <path d="M270,153 C320,153 320,168 370,168" class="edge"/>
    <text x="282" y="143" class="skill" data-skill="checkpoint">checkpoint</text>
    <text x="282" y="190" class="skill" data-skill="checklist">checklist</text>
  </g>
  <g data-operation="sources-record">
    <path d="M270,303 C320,303 320,356 370,356" class="edge"/>
    <text x="282" y="276" class="skill" data-skill="research-topic">research-topic</text>
    <text x="282" y="292" class="skill" data-skill="meeting-capture">meeting-capture</text>
  </g>
  <g data-operation="handoff-rules">
    <path d="M640,168 L820,168" class="edge"/>
    <text x="730" y="158" text-anchor="middle" class="skill" data-skill="improve-harness">improve-harness</text>
  </g>
  <g data-operation="record-absorb">
    <path d="M640,356 L790,356" fill="none" stroke="var(--line)" stroke-width="2.2"/>
    <text x="715" y="344" text-anchor="middle" class="skill" data-skill="absorb">absorb</text>
    <path d="M790,328 L790,394" fill="none" stroke="var(--line)" stroke-width="2.2"/>
    <path d="M790,328 L820,328" class="edge"/>
    <path d="M790,394 L820,394" class="edge"/>
  </g>
  <g data-operation="next-session">
    <path d="M990,422 L990,452 L20,452 L20,153 L40,153" class="edge"/>
    <text x="40" y="474" class="skill" data-skill="pickup">pickup</text><text x="100" y="474" class="small">the next session starts from better rules, a richer wiki and its handoff</text>
  </g>
  <text data-approval-note="true" x="40" y="502" class="small">Every change is proposed first and runs only once approved.</text>
</svg>
