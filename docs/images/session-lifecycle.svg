<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="session-title session-desc">
  <title id="session-title">Checkpoint or wrap, then pick up in either tool</title>
  <desc id="session-desc">Mid-task, checkpoint writes a handoff; when the task is finished, checklist wraps the session and writes one. The handoff lives outside either tool and holds pointers, open loops and changed files. Pickup in Claude Code or Codex, in any worktree of the repository, reads it and follows its pointers back to your record. A wrap also reconciles the record, captures knowledge and folds lessons into rules.</desc>
<style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191d;
        --panel: #22282e;
        --ink: #f0f2f5;
        --dim: #a2abb5;
        --line: #59636e;
        --question: #38bdf8;
        --question-bg: #102f3f;
        --answer: #fb923c;
        --answer-bg: #402719;
        --action: #34d399;
        --action-bg: #14382e;
        --off: #94a3b8;
        --off-bg: #29313a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15191d;
      --panel: #22282e;
      --ink: #f0f2f5;
      --dim: #a2abb5;
      --line: #59636e;
      --question: #38bdf8;
      --question-bg: #102f3f;
      --answer: #fb923c;
      --answer-bg: #402719;
      --action: #34d399;
      --action-bg: #14382e;
      --off: #94a3b8;
      --off-bg: #29313a;
    }
    :root[data-theme="light"] {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
    }
    .stage { fill: var(--panel); stroke-width: 2.5; }
    .input { fill: var(--question-bg); stroke: var(--question); stroke-width: 1.6; }
    .outcome { fill: var(--action-bg); stroke: var(--action); stroke-width: 1.4; }
    .label { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: var(--ink); font-family: var(--sans); font-size: 23px; font-weight: 750; }
    .stage-heading { fill: var(--ink); font-family: var(--sans); font-size: 19px; font-weight: 750; }
    .copy { fill: var(--dim); font-family: var(--sans); font-size: 15px; }
    .small { fill: var(--dim); font-family: var(--sans); font-size: 11.5px; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .branch { fill: none; stroke: var(--action); stroke-width: 1.8; marker-end: url(#action-arrow); }
    .skill { fill: var(--dim); font-family: var(--mono); font-size: 12px; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
  </style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--line)"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="var(--bg)"/>
  <text x="40" y="48" class="heading">Stop mid-task, pick up anywhere</text>
  <text data-diagram-key="true" x="40" y="75" class="copy">blue: where your session is · orange: what Hippocampus writes · green: where the next session lands</text>
  <text data-column="session" x="40" y="104" class="column" fill="var(--question)">SESSION</text>
  <text data-column="handoff" x="370" y="104" class="column" fill="var(--answer)">HANDOFF</text>
  <text data-column="next-session" x="820" y="104" class="column" fill="var(--action)">NEXT SESSION</text>
  <rect data-thing="input" x="40" y="142" width="230" height="82" rx="12" class="input"/>
  <text x="58" y="174" class="stage-heading">Mid-task</text>
  <text x="58" y="201" class="copy">context is getting tight</text>
  <rect data-thing="input" x="40" y="292" width="230" height="82" rx="12" class="input"/>
  <text x="58" y="324" class="stage-heading">Task finished</text>
  <text x="58" y="351" class="copy">tests pass, work committed</text>
  <rect data-thing="record" x="370" y="227" width="270" height="112" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="390" y="260" class="label" fill="var(--answer)">HANDOFF</text>
  <text x="390" y="291" class="stage-heading">Outside either tool</text>
  <text x="390" y="316" class="small">pointers · open loops · changed files</text>
  <rect data-thing="destination" data-outcome="next" x="820" y="214" width="340" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="next" x="836" y="238" class="outcome-title">Next session</text>
  <text x="836" y="256" class="small">Claude Code or Codex, any worktree of the repo</text>
  <rect data-thing="destination" data-outcome="record" x="820" y="290" width="340" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="record" x="836" y="314" class="outcome-title">Your record</text>
  <text x="836" y="332" class="small">tickets, documents and status: the source of truth</text>
  <g data-operation="checkpoint">
    <path d="M270,183 C320,183 320,283 370,283" class="edge"/>
    <text x="282" y="174" class="skill" data-skill="checkpoint">checkpoint</text>
  </g>
  <g data-operation="checklist">
    <path d="M270,333 C320,333 320,283 370,283" class="edge"/>
    <text x="282" y="348" class="skill" data-skill="checklist">checklist</text>
  </g>
  <g data-operation="pickup">
    <path d="M640,283 L790,283" fill="none" stroke="var(--line)" stroke-width="2.2"/>
    <text x="715" y="271" text-anchor="middle" class="skill" data-skill="pickup">pickup</text>
    <path d="M790,242 L790,318" fill="none" stroke="var(--line)" stroke-width="2.2"/>
    <path d="M790,242 L820,242" class="edge"/>
    <path d="M790,318 L820,318" class="edge"/>
  </g>
  <text x="40" y="500" class="small">A wrap also reconciles your record, captures knowledge and folds lessons into your rules before it writes the handoff.</text>
</svg>
