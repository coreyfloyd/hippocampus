<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">How the parts of Hippocampus relate</title>
  <desc id="overview-desc">A session in Claude Code or Codex writes a handoff through checkpoint or checklist and captures knowledge through knowledge-capture. Sources become a meeting record through meeting-capture or a research report through research-topic. You approve or decline each proposed change: lessons in the handoff reach rules and the agent harness through improve-harness, and absorb carries captures and research to the wiki through wiki-compile and to documents and follow-up work. Through pickup, the next session resumes from its handoff under the improved rules, with the wiki to read.</desc>
<style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191d;
        --panel: #22282e;
        --ink: #f0f2f5;
        --dim: #a2abb5;
        --line: #59636e;
        --question: #38bdf8;
        --question-bg: #102f3f;
        --answer: #fb923c;
        --answer-bg: #402719;
        --action: #34d399;
        --action-bg: #14382e;
        --off: #94a3b8;
        --off-bg: #29313a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15191d;
      --panel: #22282e;
      --ink: #f0f2f5;
      --dim: #a2abb5;
      --line: #59636e;
      --question: #38bdf8;
      --question-bg: #102f3f;
      --answer: #fb923c;
      --answer-bg: #402719;
      --action: #34d399;
      --action-bg: #14382e;
      --off: #94a3b8;
      --off-bg: #29313a;
    }
    :root[data-theme="light"] {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #b8c1ca;
      --question: #0284c7;
      --question-bg: #e0f2fe;
      --answer: #c2410c;
      --answer-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
    }
    .stage { fill: var(--panel); stroke-width: 2.5; }
    .input { fill: var(--question-bg); stroke: var(--question); stroke-width: 1.6; }
    .outcome { fill: var(--action-bg); stroke: var(--action); stroke-width: 1.4; }
    .label { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: var(--ink); font-family: var(--sans); font-size: 23px; font-weight: 750; }
    .stage-heading { fill: var(--ink); font-family: var(--sans); font-size: 19px; font-weight: 750; }
    .copy { fill: var(--dim); font-family: var(--sans); font-size: 15px; }
    .small { fill: var(--dim); font-family: var(--sans); font-size: 11.5px; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .branch { fill: none; stroke: var(--action); stroke-width: 1.8; marker-end: url(#action-arrow); }
    .skill { fill: var(--dim); font-family: var(--mono); font-size: 12px; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
    .column { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .outcome-title { fill: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 650; }
  </style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--line)"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="var(--bg)"/>
  <text x="40" y="48" class="heading">One memory, five parts, one loop</text>
  <text data-diagram-key="true" x="40" y="75" class="copy">blue: what you bring · orange: what Hippocampus writes · gray: your approval · green: what gets better</text>
  <text data-column="work" x="40" y="104" class="column" fill="var(--question)">WORK</text>
  <text data-column="memory" x="380" y="104" class="column" fill="var(--answer)">MEMORY</text>
  <text data-column="approval" x="730" y="104" class="column" fill="var(--off)">APPROVAL</text>
  <text data-column="improvement" x="870" y="104" class="column" fill="var(--action)">IMPROVEMENT</text>
  <rect data-thing="input" x="40" y="140" width="200" height="82" rx="12" class="input"/>
  <text x="58" y="172" class="stage-heading">A session</text>
  <text x="58" y="199" class="copy">in Claude Code or Codex</text>
  <rect data-thing="input" x="40" y="300" width="200" height="82" rx="12" class="input"/>
  <text x="58" y="332" class="stage-heading">Sources</text>
  <text x="58" y="359" class="copy">questions, links, meetings</text>
  <rect data-thing="record" data-concept="sessions" x="380" y="120" width="220" height="92" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="398" y="147" class="label" fill="var(--answer)">SESSIONS</text>
  <text x="398" y="174" class="stage-heading">Handoff</text>
  <text x="398" y="196" class="small">open loops · lessons · pointers</text>
  <rect data-thing="record" data-concept="capture" x="380" y="232" width="220" height="92" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="398" y="259" class="label" fill="var(--answer)">CAPTURE</text>
  <text x="398" y="286" class="stage-heading">Meeting or capture</text>
  <text x="398" y="308" class="small">records and proposed outcomes</text>
  <rect data-thing="record" data-concept="research" x="380" y="344" width="220" height="92" rx="14" class="stage" stroke="var(--answer)"/>
  <text x="398" y="371" class="label" fill="var(--answer)">RESEARCH</text>
  <text x="398" y="398" class="stage-heading">Research report</text>
  <text x="398" y="420" class="small">answer · citations · gaps</text>
  <rect data-thing="approval" x="730" y="120" width="90" height="316" rx="14" fill="var(--off-bg)" stroke="var(--off)" stroke-width="1.6"/>
  <text x="775" y="270" text-anchor="middle" class="label" fill="var(--off)">YOU</text>
  <text x="775" y="290" text-anchor="middle" class="label" fill="var(--off)">DECIDE</text>
  <text x="775" y="314" text-anchor="middle" class="small">approve or</text>
  <text x="775" y="329" text-anchor="middle" class="small">decline each</text>
  <rect data-thing="destination" data-outcome="rules" x="870" y="138" width="290" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="rules" x="886" y="162" class="outcome-title">Rules and agent harness</text>
  <text x="886" y="180" class="small">composed into CLAUDE.md and AGENTS.md</text>
  <rect data-thing="destination" data-outcome="wiki" x="870" y="250" width="290" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="wiki" x="886" y="274" class="outcome-title">Wiki</text>
  <text x="886" y="292" class="skill" data-skill="wiki-compile">wiki-compile</text>
  <rect data-thing="destination" data-outcome="documents" x="870" y="362" width="290" height="56" rx="12" class="outcome"/>
  <text data-outcome-label="documents" x="886" y="386" class="outcome-title">Documents and follow-up work</text>
  <text x="886" y="404" class="small">named updates and next steps</text>
  <g data-operation="session-handoff"><path d="M240,170 C310,170 310,166 380,166" class="edge"/><text x="250" y="158" class="skill" data-skill="checkpoint">checkpoint</text><text x="250" y="188" class="skill" data-skill="checklist">checklist</text></g>
  <g data-operation="session-capture"><path d="M240,205 C310,205 310,278 380,278" class="edge"/><text x="250" y="252" class="skill" data-skill="knowledge-capture">knowledge-capture</text></g>
  <g data-operation="sources-capture"><path d="M240,325 C310,325 310,290 380,290" class="edge"/><text x="250" y="318" class="skill" data-skill="meeting-capture">meeting-capture</text></g>
  <g data-operation="sources-research"><path d="M240,355 C310,355 310,390 380,390" class="edge"/><text x="250" y="392" class="skill" data-skill="research-topic">research-topic</text></g>
  <g data-operation="lessons"><path d="M600,166 L730,166" fill="none" stroke="var(--line)" stroke-width="2.2"/><path d="M820,166 L870,166" class="edge"/><text x="665" y="156" text-anchor="middle" class="skill" data-skill="improve-harness">improve-harness</text></g>
  <g data-operation="absorb">
    <path d="M600,278 L730,278" fill="none" stroke="var(--line)" stroke-width="2.2"/><text x="665" y="268" text-anchor="middle" class="skill" data-skill="absorb">absorb</text>
    <path d="M600,390 L730,390" fill="none" stroke="var(--line)" stroke-width="2.2"/><text x="665" y="380" text-anchor="middle" class="skill" data-skill="absorb">absorb</text>
    <path d="M820,278 L845,278" fill="none" stroke="var(--line)" stroke-width="2.2"/><path d="M820,390 L845,390" fill="none" stroke="var(--line)" stroke-width="2.2"/>
    <path d="M845,278 L845,390" fill="none" stroke="var(--line)" stroke-width="2.2"/>
    <path d="M845,278 L870,278" class="edge"/><path d="M845,390 L870,390" class="edge"/>
  </g>
  <g data-operation="next-session">
    <path d="M1010,418 L1010,456 L20,456 L20,181 L40,181" class="edge"/>
    <text x="40" y="478" class="skill" data-skill="pickup">pickup</text><text x="100" y="478" class="small">the next session resumes from its handoff, under the improved rules, with the wiki to read</text>
  </g>
  <text data-approval-note="true" x="40" y="504" class="small">Every change is proposed first and runs only once approved.</text>
</svg>
